name: Build & push Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# `git push --follow-tags` sends refs/heads/main and refs/tags/vX.Y.Z in one
# push, so two runs start on the same commit in the same second and both ask
# GitHub to resolve the same five actions. One of them comes back 503 and dies
# at "Set up job", before checkout — which is what v0.25.0 and v0.26.0 both did
# while the branch run beside them passed in 90 seconds.
#
# Keying the group on the SHA puts the two in one queue instead of a race.
# cancel-in-progress stays false on purpose: the second run is not a newer
# version of the first, it is the tagged build of the same commit, and it is
# the one that would be cancelled. It waits, then builds off a warm cache.
concurrency:
  group: docker-${{ github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hargile-website
  # Force Node 24 for any JavaScript-based action that hasn't been
  # released with Node 24 support yet (Node 20 deprecation 2026-09-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
